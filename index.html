function cartRows(c,d,editable=true){return d.cart.length?d.cart.map(x=>{const p=product(x.id,c);return `<div class="cartrow">${art(p)}<div class="cartname"><b>${p.name}</b><small>${p.variant} · ${p.sku}</small>${x.qty>available(x.id,c)?`<small style="color:var(--red)">Доступно лише ${available(x.id,c)} шт.</small>`:''}</div>${editable?`<div class="qty"><button data-a="qty" data-id="${p.id}" data-delta="-1" aria-label="Зменшити кількість: ${p.name}, ${p.variant}">−</button><span>${x.qty}</span><button data-a="qty" data-id="${p.id}" data-delta="1" aria-label="Збільшити кількість: ${p.name}, ${p.variant}">+</button></div>`:`<span class="small">${x.qty} шт.</span>`}<span class="price">${money(p.price*x.qty)}</span>${editable?`<button class="remove" data-a="remove" data-id="${p.id}" aria-label="Видалити: ${p.name}, ${p.variant}">${icon('trash')}</button>`:''}</div>`}).join(''):`<div class="emptycart">${icon('box')}Тут поки нічого немає. Додай товар із каталогу.</div>`;}
function totalHTML(c,d){const t=totals(d,c);return `<div class="order-total"><div><span class="muted">Товари</span><span>${money(t.subtotal)}</span></div>${t.discount?`<div class="discount"><span>START10 · 10%</span><span>−${money(t.discount)}</span></div>`:''}<div><span class="muted">Доставка</span><span>${t.shipping?money(t.shipping):'Безкоштовно'}</span></div><div class="total"><span>Разом</span><span>${money(t.total)}</span></div></div>`;}
function catalogHTML(c){const q=searchTerm.toLowerCase();const ps=CATALOG.filter(p=>(p.name+' '+p.variant+' '+p.sku).toLowerCase().includes(q));return ps.length?ps.map(base=>{const p=product(base.id,c),n=available(p.id,c);return `<article class="product" data-product="${p.id}">${art(p)}<div class="product-info"><b>${p.name}</b><span class="variant">${p.variant}</span><span class="micro muted">${p.sku}</span><div class="stock ${n===0?'none':''}">На складі ${p.onhand} · резерв ${p.reserved}<br><strong>Доступно ${n} шт.</strong></div><div class="product-buy"><span class="price">${money(p.price)}</span><button class="addbtn" data-a="add" data-id="${p.id}" aria-label="Додати: ${p.name}, ${p.variant}" ${n===0?'disabled':''}>${n===0?'Немає':(active()?.draft.cart.some(x=>x.id===p.id)?'Додати ще':'Додати')}</button><span class="in-cart" data-count="${p.id}">${active()?.draft.cart.find(x=>x.id===p.id)?.qty?'У замовленні: '+active().draft.cart.find(x=>x.id===p.id).qty+' шт.':''}</span></div></div></article>`}).join(''):'<p class="muted small">За цим запитом нічого не знайдено.</p>';}
function productsForm(c,d){return `<div class="form-title"><div><h2>Склад замовлення</h2><p>Варіанти одного товару мають різні SKU.</p></div>${hintButton(c)}</div><div class="searchwrap">${icon('search')}<input class="search" id="catalog-search" value="${esc(searchTerm)}" placeholder="Пошук за моделлю, кольором або SKU" aria-label="Пошук у каталозі"></div><div class="cataloggrid" id="catalog">${catalogHTML(c)}</div><div class="cart-title"><h3>У замовленні</h3><span class="badge gray">${d.cart.reduce((n,x)=>n+x.qty,0)} шт.</span></div>${cartRows(c,d)}<div class="promo"><div class="field"><label for="f-promo">Промокод із запиту</label><input id="f-promo" data-field="promo" value="${esc(d.promo)}" placeholder="Якщо клієнт надав код" autocomplete="off"><small>START10 · 10% на товари. Доставка рахується окремо.</small></div></div>${d.promo&&d.promo.toUpperCase()!=='START10'?'<div class="infobox red">Цей код не діє в навчальному магазині.</div>':''}${totalHTML(c,d)}`;}
function deliveryForm(c,d){return `<div class="form-title"><div><h2>Куди відправляємо і як оплачують</h2><p>Клієнт обрав спосіб оплати. А чи прийшли гроші — перевіряємо окремо.</p></div>${hintButton(c)}</div><div class="formgrid"><div class="field"><label for="f-delivery">Спосіб доставки</label><select id="f-delivery" data-field="delivery">${options({branch:'У відділення',courier:'Кур’єром',pickup:'Самовивіз'},d.delivery)}</select></div><div class="field"><label for="f-city">Місто</label><select id="f-city" data-field="city">${options(Object.fromEntries(Object.keys(BRANCHES).map(x=>[x,x])),d.city,'Обери місто')}</select></div>${d.delivery==='branch'?`<div class="field full"><label for="f-branch">Відділення · навчальний довідник</label><select id="f-branch" data-field="branch" ${!d.city?'disabled':''}>${options(Object.fromEntries((BRANCHES[d.city]||[]).map(n=>[n,d.city+' · відділення №'+n])),d.branch,'Обери відділення')}</select><small>Це вигаданий довідник для тренування, без підключення до перевізника.</small></div>`:d.delivery==='courier'?inputField('Адреса доставки','address',d.address):'<div class="infobox">Самовивіз із навчальної точки магазину.</div>'}<div class="field"><label for="f-pay">Домовлений спосіб оплати</label><select id="f-pay" data-field="pay">${options(PAY_NAMES,d.pay)}</select></div><div class="field"><label for="f-payment">Фактичний статус оплати</label><select id="f-payment" data-field="payment">${Object.entries(PAYMENT_NAMES).map(([v,n])=>`<option value="${v}"${selected(d.payment,v)}>${n}</option>`).join('')}</select></div></div><div class="infobox">${icon('bank')}<p>Онлайн-оплату й переказ звіряємо з реєстром. <button class="btn ghost compact" data-a="source" data-tab="bank">Відкрити реєстр оплат</button></p></div>${totalHTML(c,d)}`;}
function finalForm(c,d){const confirmed=d.confirmation&&d.confirmation===signature(d);return `<div class="form-title"><div><h2>Остання перевірка</h2><p>Звір картку й обери наступну дію.</p></div>${hintButton(c)}</div><div class="summary-block"><h3>Замовлення #${c.id}</h3><div class="summary-row"><span>Отримувач</span><span>${esc(d.name||'Не заповнено')}<br>${esc(d.phone||'Немає номера')}</span></div><div class="summary-row"><span>Доставка</span><span>${esc(d.city||'Місто не обрано')}${d.delivery==='branch'?', відділення №'+esc(d.branch||'—'):d.delivery==='courier'?', '+esc(d.address):', самовивіз'}</span></div><div class="summary-row"><span>Оплата</span><span>${esc(PAY_NAMES[d.pay]||'Не обрано')}<br>${esc(PAYMENT_NAMES[d.payment])}</span></div>${cartRows(c,d,false)}${totalHTML(c,d)}</div><button class="btn secondary" data-a="confirm-customer">${icon('chat')}${confirmed?'Погоджено · надіслати ще раз':'Погодити підсумок у навчальному чаті'}</button>${confirmed?'<div class="infobox green">'+icon('check')+'<p>Клієнт погодив поточні деталі замовлення.</p></div>':'<p class="small muted" style="margin-top:10px">Після зміни деталей попереднє погодження втрачає актуальність.</p>'}${c.existing?`<div class="field full" style="margin-top:22px"><label for="f-linked">Пов’язане замовлення</label><select id="f-linked" data-field="linked">${options({'1039':'№1039 · ті самі отримувач і товари'},d.linked,'Не пов’язано')}</select></div>`:''}<label class="checkline"><input type="checkbox" data-field="reserve" ${d.reserve?'checked':''}><span>Зарезервувати товари для цього замовлення<small>Перед передачею на склад потрібен резерв. Для дубля повторний резерв не робимо.</small></span></label><div class="formgrid"><div class="field full"><label for="f-final">Наступний крок</label><select id="f-final" data-field="final">${options(FINAL_NAMES,d.final,'Обери рішення')}</select></div><div class="field full"><label for="f-note">Коментар для команди · необов’язково</label><textarea id="f-note" data-field="note" placeholder="Важливі домовленості, заміна або причина затримки">${esc(d.note)}</textarea></div></div>`;}
function sourceHTML(c,d){const bankSeen=d.actions.includes('bank');let content='';if(sourceTab==='chat')content=`<div class="chatname"><span class="chatavatar">${c.name.split(' ').map(x=>x[0]).join('')}</span>${c.name}</div><div class="bubble">${esc(c.message)}<span class="bubblemicro">Звернення із сайту · навчальний приклад</span></div>${c.existing?'<div class="badge gray" style="margin-bottom:14px">Прикріплено: скрін квитанції</div>':''}${active().messages.map(m=>`<div class="bubble ${m.role==='manager'?'manager':''}">${esc(m.text)}<span class="bubblemicro">${m.role==='manager'?'Менеджер · симуляція':'Відповідь клієнта · симуляція'}</span></div>`).join('')}`;else if(sourceTab==='bank')content=`<span class="badge ${c.ledger?'green':'gray'}">${esc(c.bank)}</span><div class="bankcard"><span class="micro muted">Фактично зараховано</span><strong>${money(c.ledger)}</strong><dl class="data-pairs"><dt>Замовлення</dt><dd>#${c.existing||c.id}</dd><dt>Канал</dt><dd>${c.pay==='cod'?'Післяплата':c.pay==='transfer'?'Банківський переказ':'Онлайн-еквайринг'}</dd><dt>Джерело</dt><dd>Демо реєстр</dd></dl></div><p class="small muted">${c.existing?'Квитанцію надіслав клієнт. У реєстрі зарахування ще не підтверджене.':c.pay==='cod'?'Клієнт платить при отриманні. Попереднє зарахування не потрібне.':'Суму в реєстрі потрібно зіставити з повною сумою замовлення.'}</p><span class="badge ${bankSeen?'green':'gray'}">${bankSeen?'Переглянуто':'Не переглянуто'}</span>`;else content=c.existing?`<span class="badge gray">1 пов’язане звернення</span><div class="bankcard"><h3>Замовлення #1039</h3><p class="small muted">Створене раніше сьогодні · очікує оплати</p><p class="small">Дмитро Мельник<br>+380 00 000 00 04</p><p class="small">1 × MOVE 18 л, графіт<br>1 × AERO 600 мл, графіт</p><b>${money(2780)}</b><p class="small muted" style="margin-top:10px;margin-bottom:0">Київ · відділення №12<br>Резерв уже створений у №1039</p></div><p class="small muted">Однаковий номер телефону ще не доводить дублювання. Уточни в клієнта, чи це повторна покупка.</p>`:'<div class="bankcard"><h3>Попередніх замовлень немає</h3><p class="small muted" style="margin:0">За тестовим номером отримувача збігів не знайдено.</p></div>';
return `<aside class="panel source ${sourceOpen?'mobile-open':''}" aria-label="Матеріали звернення"><div class="source-head"><button class="iconbtn mobile-source-close" data-a="source-close" aria-label="Повернутись до замовлення" title="Повернутись до замовлення">${icon('close')}</button><h3>${icon('chat')}Матеріали звернення</h3><p>Дані для оформлення. Усі дії — симуляція.</p></div><div class="sourcetabs" role="tablist" aria-label="Матеріали"><button role="tab" aria-selected="${sourceTab==='chat'}" class="${sourceTab==='chat'?'active':''}" data-a="source-tab" data-tab="chat">Чат</button><button role="tab" aria-selected="${sourceTab==='bank'}" class="${sourceTab==='bank'?'active':''}" data-a="source-tab" data-tab="bank">Оплати</button><button role="tab" aria-selected="${sourceTab==='history'}" class="${sourceTab==='history'?'active':''}" data-a="source-tab" data-tab="history">Історія${c.existing?' · 1':''}</button></div><div class="sourcecontent" role="tabpanel">${content}</div>${sourceTab==='chat'?`<div class="chatactions">${Object.entries(c.actions||{}).map(([key,a])=>`<button data-a="chat-action" data-key="${key}" ${d.actions.includes(key)?'disabled':''}>${icon(d.actions.includes(key)?'check':'chat')}${a.label}</button>`).join('')}<button data-a="confirm-customer">${icon('chat')}Погодити підсумок замовлення</button></div><div class="sourcehint">Повідомлення з’являються тільки тут. Жодного надсилання реальним людям.</div>`:''}</aside>`;}
function feedbackHTML(){if(!feedback)return '';return `<section id="feedback" class="feedback ${feedback.issues.length?'':'success'}" aria-live="polite"><h3>${icon(feedback.issues.length?'alert':'check')}${feedback.issues.length?'Що треба перевірити':'Цей етап перевірено'}</h3>${feedback.issues.length?`<p class="small muted">Картка збережена як чернетка. Можна виправити й перевірити знову.</p><ul>${feedback.issues.map(x=>`<li><b>${x.label}</b><span>${x.why}</span><button data-a="step" data-step="${x.step}">Перейти: ${STEP_NAMES[x.step]}</button></li>`).join('')}</ul>`:'<p class="small">Можна продовжувати оформлення.</p>'}</section>`;}
function work(){const c=caze();if(!c){route='home';return home();}const d=active().draft;return `<div class="animate-in"><div class="workspace-head"><div>${badgeMode(c)}<h1>Замовлення #${c.id}</h1><p>${c.title}</p></div><div class="workspace-tools"><button class="btn secondary compact mobile-sources" data-a="source" data-tab="chat">${icon('chat')}Матеріали звернення</button><button class="btn secondary compact" data-a="rules">${icon('book')}Правила</button><button class="btn ghost compact" data-a="restart">${icon('refresh')}Заново</button></div></div><div class="workspace"><div class="work-left">${guidance(c)}<div class="panel"><nav class="stepnav" aria-label="Етапи оформлення">${STEP_NAMES.map((n,i)=>`<button data-a="step" data-step="${i}" class="${i===step?'active':''}" ${i===step?'aria-current="step"':''}><span class="stepnum">${i+1}</span>${n}</button>`).join('')}</nav><section class="panel-pad">${[customerForm,productsForm,deliveryForm,finalForm][step](c,d)}</section><div class="formfooter"><button class="btn ghost compact" data-a="home">До сценаріїв</button><div class="right">${c.mode==='practice'&&step<3?'<button class="btn secondary compact" data-a="check-step">Перевірити етап</button>':''}<button class="btn compact" data-a="${step===3?'submit':'next'}">${step===3?(c.mode==='demo'?'Завершити розбір':'Завершити оформлення'):['Далі: товари','Далі: доставка','Далі: перевірка'][step]}</button></div></div></div>${feedbackHTML()}</div>${sourceHTML(c,d)}</div></div>`;}
function bestAttempt(id){return memory.attempts.find(x=>x.id===id);}
function report(){const r=bestAttempt(reportId);if(!r){route='analytics';return analytics();}const c=CASES.find(x=>x.id===r.caseId);return `<div class="animate-in"><section class="reporthero"><div class="score-ring"><div>${c.mode==='demo'?icon('check'):r.firstScore+'%'}<small>${c.mode==='demo'?'РОЗБІР':'ПЕРША ПЕРЕВІРКА'}</small></div></div><div><div class="eyebrow" style="color:var(--lime)">${c.mode==='demo'?'Розбір завершено':r.hints?'Завершено з підтримкою':'Сценарій завершено'}</div><h1>${c.title}</h1><p>${c.mode==='demo'?'Одне замовлення вже пройшли. Далі спробуєш сама, а підказки залишаться поруч.':r.firstScore===100?'З першої перевірки все зійшлося.':'Картку поправила, тепер усе сходиться. Результат першої перевірки теж залишився нижче.'}</p></div></section><div class="statgrid"><div class="statcard"><small>Підсумкова перевірка</small><b>${c.mode==='demo'?'Розбір':'100%'}</b><small>Усі необхідні дії виконані</small></div><div class="statcard"><small>Перевірок картки</small><b>${r.attempts}</b><small>Повне оформлення</small></div><div class="statcard"><small>Звернень до підказок</small><b>${r.hints}</b><small>Довідник не враховується</small></div><div class="statcard"><small>Активний час</small><b>${duration(r.metrics.reduce((n,x)=>n+x.ms,0))}</b><small>Не впливає на оцінку</small></div></div><div class="reportgrid"><section class="panel panel-pad"><h2>Чому саме так</h2>${c.explain.map(([h,p])=>`<div class="decision">${icon('check')}<div><b>${h}</b><p>${p}</p></div></div>`).join('')}</section><section class="panel panel-pad"><h2>Результат рішення</h2><div class="summary-row"><span>Наступна дія</span><span>${FINAL_NAMES[c.final]}</span></div><div class="summary-row"><span>Оплата</span><span>${PAYMENT_NAMES[c.payment]}</span></div><div class="summary-row"><span>Товари</span><span>${c.items.map(x=>x.qty+' × '+product(x.id,c).name+' · '+product(x.id,c).variant).join('<br>')}</span></div><div class="summary-row"><span>Сума</span><span>${money(totals(solvedDraft(c),c).total)}</span></div><div class="infobox">${icon('info')}<p>Деталі погоджені та перевірені за правилами навчального магазину. Нижче — дані проходження за кожним етапом.</p></div></section></div><section class="panel"><div class="panel-pad"><h2>Де знадобилась увага</h2><p class="small muted" style="margin:0">Дані саме цієї спроби. Куратор отримає їх, лише якщо ти передаси експорт.</p></div>${metricTable(r.metrics)}<div class="panel-pad" style="padding-top:10px"><p class="small muted" style="margin:0">Час рахуємо у відкритій вкладці до хвилини без взаємодії. Довше на кроці не означає гірше виконання.</p></div></section><div class="report-actions"><button class="btn" data-a="start" data-id="${CASES[(CASES.indexOf(c)+1)%CASES.length].id}">Наступний сценарій</button><button class="btn secondary" data-a="analytics">Усі результати</button><button class="btn secondary" data-a="export" data-format="csv">${icon('download')}CSV</button><button class="btn secondary" data-a="export" data-format="json">JSON</button><button class="btn ghost" data-a="print">Друк</button></div></div>`;}
function duration(ms){const s=Math.round(ms/1000);return s>=60?Math.floor(s/60)+' хв '+s%60+' с':s+' с';}
function metricTable(metrics){const max=Math.max(...metrics.map(x=>x.errors),1);return `<div class="tablewrap"><table><thead><tr><th>Етап</th><th>Активний час</th><th>Повернення</th><th>Зауваження</th><th>Підказки</th></tr></thead><tbody>${metrics.map((x,i)=>`<tr><td><b>${STEP_NAMES[i]}</b></td><td>${duration(x.ms)}</td><td>${Math.max(0,x.visits-1)}</td><td><div class="heat"><span>${x.errors}</span><span class="heatbar"><i style="width:${100*x.errors/max}%"></i></span></div></td><td>${x.hints}</td></tr>`).join('')}</tbody></table></div>`;}
function analytics(){const rs=memory.attempts,practice=rs.filter(x=>CASES.find(c=>c.id===x.caseId).mode!=='demo');if(!rs.length)return `<section class="panel noresults"><div class="overview-icon">${icon('chart')}</div><h1 style="font-size:1.7rem">Тут будуть твої результати</h1><p class="muted">Заверши сценарій, щоб побачити перевірки, підказки й дані за етапами.</p><button class="btn" data-a="start" data-id="1048">Почати з розбору</button></section>`;const ms=STEP_NAMES.map((_,i)=>rs.reduce((o,r)=>({ms:o.ms+r.metrics[i].ms,hints:o.hints+r.metrics[i].hints,errors:o.errors+r.metrics[i].errors,visits:o.visits+r.metrics[i].visits}),{ms:0,hints:0,errors:0,visits:0}));return `<div class="animate-in"><div class="section-head"><div><div class="eyebrow">Навчальна аналітика</div><h1 style="font-size:2rem;margin-bottom:0">Мої результати</h1></div><div class="workspace-tools"><button class="btn secondary compact" data-a="export" data-format="csv">${icon('download')}CSV</button><button class="btn secondary compact" data-a="export" data-format="json">JSON</button></div></div><div class="statgrid"><div class="statcard"><small>Завершені спроби</small><b>${rs.length}</b><small>Включно з розбором</small></div><div class="statcard"><small>Точність першої перевірки</small><b>${practice.length?Math.round(practice.reduce((n,r)=>n+r.firstScore,0)/practice.length)+'%':'—'}</b><small>Без демонстраційного сценарію</small></div><div class="statcard"><small>Самостійно, без підказок</small><b>${practice.filter(r=>CASES.find(c=>c.id===r.caseId).mode==='independent'&&r.hints===0).length}</b><small>Завершені спроби</small></div><div class="statcard"><small>Звернень до підказок</small><b>${practice.reduce((n,r)=>n+r.hints,0)}</b><small>Без відкривання правил</small></div></div><section class="panel" style="margin-bottom:24px"><div class="panel-pad"><h2>Історія проходження</h2></div><div class="tablewrap"><table><thead><tr><th>Сценарій</th><th>Режим</th><th>Перша перевірка</th><th>Підказки</th><th>Деталі</th></tr></thead><tbody>${[...rs].reverse().map(r=>{const c=CASES.find(x=>x.id===r.caseId);return `<tr><td><b>${c.title}</b><br><span class="micro muted">${new Date(r.completed).toLocaleString('uk-UA')}</span></td><td>${MODES[c.mode]}</td><td>${c.mode==='demo'?'Без оцінки':r.firstScore+'%'}</td><td>${r.hints}</td><td><button class="btn secondary compact" data-a="report" data-id="${r.id}">Відкрити</button></td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><div class="panel-pad"><h2>Сумарно за етапами</h2><p class="small muted" style="margin:0">Зауваження — невиконані перевірки, показані під час проходження; вони можуть повторюватися в різних спробах.</p></div>${metricTable(ms)}</section><div class="infobox">${icon('shield')}<p>Ці дані зберігаються лише в цьому браузері. Авторка не отримує їх автоматично. Експорт містить ідентифікатори сценаріїв і навчальні метрики, без введених контактів.</p></div></div>`;}
function render(){app.innerHTML=shell(route==='work'?work():route==='report'?report():route==='analytics'?analytics():home());}
function moveStep(n){tick();step=Math.max(0,Math.min(3,n));active().step=step;active().metrics[step].visits++;hintLevel=0;feedback=null;searchTerm='';demoShown=false;save();render();document.querySelector('.work-left')?.scrollIntoView({block:'start',behavior:'auto'});}
function setField(key,value){const a=active();if(!a)return;const d=a.draft;if(d[key]===value)return;d[key]=value;if(key==='city')d.branch='';a.metrics[step].changes++;a.events.push({type:'field',step,field:key,at:Date.now()});a.events=a.events.slice(-250);save();}
function openSource(tab){sourceTab=tab;const a=active();if(a&&['bank','history'].includes(tab)&&!a.draft.actions.includes(tab))a.draft.actions.push(tab);if(window.innerWidth<=1050)sourceOpen=true;save();render();}
function confirmCustomer(){const a=active(),c=caze(),d=a.draft;if(!d.name||!d.phone||!d.cart.length||!d.city||!d.branch||!d.pay){toast('Спершу заповни отримувача, товари, доставку й спосіб оплати.');return;}if(c.requiredAction&&!d.actions.includes(c.requiredAction)){toast('Спершу уточни невизначені деталі у клієнта. Дія є в навчальному чаті.');openSource('chat');return;}const t=totals(d,c);a.messages.push({role:'manager',text:`Погоджуємо: ${d.cart.map(x=>x.qty+' × '+product(x.id,c).name+', '+product(x.id,c).variant).join('; ')}. ${d.city}, відділення №${d.branch}. ${PAY_NAMES[d.pay]}. Разом ${money(t.total)}.`},{role:'client',text:c.confirm});d.confirmation=signature(d);sourceTab='chat';if(window.innerWidth<=1050)sourceOpen=true;save();render();toast('Відповідь клієнта з’явилась у навчальному чаті. Звір її з карткою.');}
function demoFill(){const c=caze(),a=active(),d=a.draft;if(c.mode!=='demo')return;if(step===0){d.name=c.name;d.phone=c.phone;}if(step===1){d.cart=c.items.map(x=>({...x}));d.promo=c.promo;}if(step===2){d.city=c.city;d.branch=c.branch;d.delivery='branch';d.pay=c.pay;d.payment=c.payment;if(!d.actions.includes('bank'))d.actions.push('bank');sourceTab='bank';}if(step===3){d.reserve=true;d.final='warehouse';d.confirmation=signature(d);if(!a.messages.some(m=>m.text===c.confirm)){a.messages.push({role:'manager',text:'Погоджуємо дві графітові AERO, Київ, відділення №12, оплату карткою та підсумок 1 507 грн.'},{role:'client',text:c.confirm});}sourceTab='chat';}if(!a.demoStepDone.includes(step))a.demoStepDone.push(step);save();render();toast('Частину заповнила. Тепер глянь на підказку над карткою — там твоя дія.');}
function validate(full){const a=active(),c=caze();tick();if(c.mode==='demo'&&full&&a.demoStepDone.length<4){toast('Спершу переглянь дію на кожному з чотирьох етапів.');return;}const g=grade(a.draft,c),issues=full?g.issues:g.issues.filter(x=>x.step===step);if(full){a.attempts++;if(a.firstScore===null)a.firstScore=g.score;}a.metrics[step].checks++;for(const issue of issues)a.metrics[issue.step].errors++;a.events.push({type:full?'full-check':'step-check',step,issues:issues.map(x=>x.id),at:Date.now()});if(full&&g.passed){const r={id:a.id,caseId:a.caseId,started:a.started,completed:new Date().toISOString(),metrics:a.metrics,attempts:a.attempts,firstScore:a.firstScore,hints:a.hints,passed:true,events:a.events};memory.attempts.push(r);memory.attempts=memory.attempts.slice(-50);memory.active=null;reportId=r.id;route='report';sourceOpen=false;feedback=null;save();render();window.scrollTo(0,0);return;}feedback={issues};save();render();setTimeout(()=>document.getElementById('feedback')?.scrollIntoView({block:'nearest',behavior:'auto'}),30);}
function toast(text){const el=document.getElementById('toasts');el.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.innerHTML='',4500);}
function modal(title,body){modalReturn=document.activeElement;const el=document.getElementById('dialogs');el.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" data-a="modal-close" aria-label="Закрити">${icon('close')}</button></div><div class="modalbody">${body}</div></section></div>`;el.querySelector('button')?.focus();}
function closeModal(){document.getElementById('dialogs').innerHTML='';modalReturn?.focus();}
function rules(){const rules=[['box','Товар і резерв','Вільний залишок = кількість на складі мінус уже зарезервоване. Кольори та об’єми мають різні SKU. Не замінюємо товар без відповіді клієнта.'],['chat','Домовленості','Уточни неоднозначний варіант. Погодь із клієнтом склад, повну суму та доставку. Після зміни цих деталей погодження отримуємо заново.'],['work','Доставка й промокод','Навчальні тарифи магазину: відділення — 85 грн, кур’єр — 140 грн, самовивіз — 0 грн. Від 2 500 грн вартості товарів після знижки доставка безкоштовна. Це не тарифи реального перевізника. START10 дає 10% на товари; код застосовуємо, коли він є у зверненні.'],['bank','Перевірка оплати','Спосіб оплати беремо зі звернення. Факт і суму зарахування — з реєстру. Скрін квитанції не підтверджує надходження. Для картки чи переказу передача на склад можлива після повної оплати. Післяплата не потребує попереднього зарахування.'],['shield','Передача й повторні звернення','Нове замовлення передаємо на склад після погодження, перевірки залишків, доставки, оплати й створення резерву. Для повторного звернення щодо існуючого замовлення не створюємо дубль і не резервуємо вдруге.'],['chart','Що зберігається','У цьому браузері: активний час за етапами, повернення, зауваження й запити підказок. Час не впливає на оцінку. Дані не надсилаються авторці; їх можна вивантажити у CSV/JSON. Довідник не вважається підказкою.']];modal('Правила навчального магазину',`<p class="muted small">Це власна процедура вигаданого магазину товарів для дому й подорожей. Вона потрібна для всіх чотирьох сценаріїв.</p><div class="rules">${rules.map(([i,t,p])=>`<div class="rule"><span class="ruleicon">${icon(i)}</span><div><h3>${t}</h3><p>${p}</p></div></div>`).join('')}</div>`);}
function downloadBlob(text,name,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function offline(){const doc=document.documentElement.cloneNode(true);doc.querySelectorAll('script').forEach(s=>{if(s.id!=='orderlab-app')s.remove();});doc.querySelector('#app').innerHTML='';doc.querySelector('#dialogs').innerHTML='';doc.querySelector('#toasts').innerHTML='';downloadBlob('<!doctype html>\n'+doc.outerHTML,'OrderLab.html','text/html;charset=utf-8');toast('Збережи HTML і відкрий його у браузері. Він працює без інтернету.');}
function exportResults(format){if(!memory.attempts.length){toast('Спочатку заверши хоча б один сценарій.');return;}const rs=route==='report'?[bestAttempt(reportId)]:memory.attempts;const sanitized=rs.map(r=>({...r,events:r.events.map(e=>({type:e.type,step:e.step,field:e.field,issues:e.issues,at:e.at}))}));if(format==='json'){downloadBlob(JSON.stringify({app:'OrderLab',version:1,exported:new Date().toISOString(),note:'Навчальні метрики, без введених контактів. Активний час не є оцінкою швидкості.',attempts:sanitized},null,2),'OrderLab_results.json','application/json');return;}const rows=[['Сценарій','Режим','Завершено','Перша оцінка %','Перевірок картки','Підказок у спробі','Етап','Активний час, с','Повернення','Зауваження','Підказки етапу']];rs.forEach(r=>{const c=CASES.find(x=>x.id===r.caseId);r.metrics.forEach((m,i)=>rows.push([c.title,MODES[c.mode],r.completed,c.mode==='demo'?'Без оцінки':r.firstScore,r.attempts,r.hints,STEP_NAMES[i],Math.round(m.ms/1000),Math.max(0,m.visits-1),m.errors,m.hints]));});downloadBlob('\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'OrderLab_results.csv','text/csv;charset=utf-8');}
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field]')&&el.type!=='checkbox'&&el.tagName!=='SELECT'){setField(el.dataset.field,el.value);if(el.dataset.field==='promo'){const at=el.selectionStart;render();const n=document.getElementById('f-promo');n?.focus();n?.setSelectionRange(at,at);}}if(el.id==='catalog-search'){searchTerm=el.value;document.getElementById('catalog').innerHTML=catalogHTML(caze());}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-field]')){setField(el.dataset.field,el.type==='checkbox'?el.checked:el.value);if(el.tagName==='SELECT'||el.type==='checkbox')render();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();const action=b.dataset.a,a=active(),c=caze();switch(action){case 'home':nav('home');break;case 'analytics':nav('analytics');break;case 'work':if(a)nav('work');break;case 'menu':menuOpen=!menuOpen;render();break;case 'start':begin(b.dataset.id);break;case 'confirm-start':closeModal();begin(b.dataset.id,true);break;case 'rules':rules();break;case 'modal-close':closeModal();break;case 'download':offline();break;case 'step':moveStep(+b.dataset.step);break;case 'next':moveStep(step+1);break;case 'source':openSource(b.dataset.tab);break;case 'source-tab':openSource(b.dataset.tab);break;case 'source-close':sourceOpen=false;render();break;case 'hint':hintLevel=Math.min(2,hintLevel+1);a.hints++;a.metrics[step].hints++;save();render();break;case 'hint-hide':hintLevel=0;render();break;case 'demo-fill':demoFill();break;case 'chat-action':{const key=b.dataset.key,spec=c.actions?.[key];if(!spec||a.draft.actions.includes(key))break;a.messages.push({role:'manager',text:spec.question},{role:'client',text:spec.reply});a.draft.actions.push(key);save();render();toast('Відповідь клієнта додано до навчального чату.');break;}case 'confirm-customer':confirmCustomer();break;case 'add':{let line=a.draft.cart.find(x=>x.id===b.dataset.id);if(line)line.qty++;else a.draft.cart.push({id:b.dataset.id,qty:1});a.metrics[1].changes++;save();render();break;}case 'qty':{const line=a.draft.cart.find(x=>x.id===b.dataset.id);if(line){line.qty+=+b.dataset.delta;if(line.qty<=0)a.draft.cart=a.draft.cart.filter(x=>x!==line);}a.metrics[1].changes++;save();render();break;}case 'remove':a.draft.cart=a.draft.cart.filter(x=>x.id!==b.dataset.id);a.metrics[1].changes++;save();render();break;case 'check-step':validate(false);break;case 'submit':validate(true);break;case 'report':reportId=b.dataset.id;nav('report');break;case 'export':exportResults(b.dataset.format);break;case 'print':window.print();break;case 'restart':modal('Почати сценарій заново?',`<p>Чернетка й метрики поточної спроби скинуться. Уже завершені результати залишаться.</p><div class="report-actions"><button class="btn" data-a="confirm-start" data-id="${c.id}">Почати заново</button><button class="btn secondary" data-a="modal-close">Скасувати</button></div>`);break;}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal();});
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(e.key==='Escape'){if(m)closeModal();else if(sourceOpen){sourceOpen=false;render();}else if(menuOpen){menuOpen=false;render();}}if(m&&e.key==='Tab'){const fs=[...m.querySelectorAll('button,a,input,select,textarea')].filter(x=>!x.disabled),f=fs[0],l=fs.at(-1);if(e.shiftKey&&document.activeElement===f){e.preventDefault();l?.focus();}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f?.focus();}}});

const ACHIEVEMENTS=[
 {id:'first',title:'Перший вихід',text:'Побачила повний шлях замовлення.',icon:'work',meme:'patron-smile',xp:40},
 {id:'clarity',title:'Без «мабуть»',text:'Уточнила, який саме товар потрібен, і додала його в замовлення.',icon:'chat',meme:'base',xp:70},
 {id:'stock',title:'Мінус сюрприз на складі',text:'Помітила нестачу й погодила рішення.',icon:'box',meme:'patron-surprised',xp:90},
 {id:'duplicate',title:'Другого не буде',text:'Знайшла повторне звернення й не створила дубль.',icon:'shield',meme:'patron-surprised',xp:90},

];
function initCampaign(){if(!memory.game)memory.game={round:1,completed:[],badges:[],xp:0,feed:[],memes:true};return memory.game;}
initCampaign();
let lastRenderRoute=route,gameNotice=null,lastAward=null;
function achievement(id){return ACHIEVEMENTS.find(x=>x.id===id);}
function recordEvent(title,text,who='Система',kind='info'){const g=initCampaign();g.feed.push({title,text,who,kind,at:new Date().toISOString()});g.feed=g.feed.slice(-40);save();}
function reaction(id,title,text){const g=initCampaign();if(!g.memes)return;const m=MEMES[id]||MEMES['patron-smile'];if(!m)return;const el=document.getElementById('toasts');el.innerHTML=`<aside class="meme-pop" role="status"><img src="${m.data}" alt="${esc(m.label)}"><div><span class="eyebrow">${esc(title)}</span><p>${esc(text)}</p></div><button data-a="meme-close" aria-label="Закрити реакцію">${icon('close')}</button></aside>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.innerHTML='',6500);}
function earn(id){const g=initCampaign();if(g.badges.includes(id))return false;const a=achievement(id);if(!a)return false;g.badges.push(id);g.xp+=a.xp;lastAward=a;recordEvent(a.title,a.text,'Досягнення','success');return true;}
function rank(){const n=initCampaign().completed.length;return n===4?'Зміна завершена':n>=2?'Самостійна робота':n===1?'Практика':'Знайомство';}
function sticker(id,cls=''){const m=MEMES[id]||MEMES['patron-smile'];return m?`<img class="sticker ${cls}" src="${m.data}" alt="${esc(m.label)}" loading="lazy">`:'';}
function campaignStrip(){const g=initCampaign();return `<section class="campaign-strip"><div class="shift-mark">${icon('spark')}<span><b>Зміна ${g.round} · ${rank()}</b><small>${g.completed.length} із 4 звернень опрацьовано</small></span></div><div class="shift-progress" aria-label="Опрацьовано ${g.completed.length} із 4 звернень">${CASES.map(c=>`<span class="${g.completed.includes(c.id)?'done':''}"></span>`).join('')}</div><span class="xp-label">${g.xp} XP <small>досвіду</small></span><button class="btn ghost compact" data-a="collection">${icon('shield')}<span>Колекція · ${g.badges.length}</span></button><button class="meme-switch" data-a="toggle-memes" aria-pressed="${g.memes}">${g.memes?'Меми: так':'Меми: пауза'}</button></section>`;}
function skillPanel(){const ids=initCampaign().badges;const skills=[['Робота із запитом',['clarity']],['Залишки й винятки',['stock']],['Оплата й повторні звернення',['duplicate','money']]];return `<section class="skill-progress"><div><h2>Що вже спробувала</h2><p>Тут видно, з якими ситуаціями ти вже розібралась. За нові досягнення додаються XP.</p></div><div class="skill-tracks">${skills.map(([n,a])=>`<div><span>${n}<b>${a.filter(x=>ids.includes(x)).length}/${a.length}</b></span><div class="track"><i style="width:${100*a.filter(x=>ids.includes(x)).length/a.length}%"></i></div></div>`).join('')}</div></section>`;}
function feedHTML(){const items=initCampaign().feed.slice(-4).reverse();return `<section class="shift-feed"><div class="section-head"><h2>Що відбувається на зміні</h2><span class="small muted">Події після твоїх дій</span></div>${items.length?items.map(e=>`<div class="feed-event"><span class="feed-icon ${e.kind}">${icon(e.kind==='success'?'check':e.who==='Фінанси'?'bank':'chat')}</span><div><small>${esc(e.who)}</small><b>${esc(e.title)}</b><p>${esc(e.text)}</p></div></div>`).join(''):`<div class="feed-event"><span class="feed-icon">${icon('chat')}</span><div><small>Софія · склад</small><b>Привіт на зміні!</b><p>Привіт! Зібране й погоджене замовлення передавай нам. Якщо щось не зійдеться — напишу, що перевірити.</p></div></div>`}</section>`;}
home=function(){const g=initCampaign();return `<div class="animate-in">${campaignStrip()}<section class="shift-hero"><div><div class="eyebrow">Інтерактивний симулятор · перша зміна</div><h1>${g.completed.length===4?'Зміну закрито.<br>Ти впоралась.':'Ну що, оформимо<br>замовлення?'}</h1><p>${g.completed.length===4?'З усіма чотирма зверненнями розібрались. Можна глянути результати або спробувати ще раз — умови будуть трохи інші.':'Тут чотири звернення з інтернет-магазину. Десь треба уточнити колір, десь товару не вистачає, а десь клієнт уже все замовив і просто пише ще раз. Спробуй розібратись, що з цим робити.'}</p><div class="hero-actions"><button class="btn lime" data-a="${g.completed.length===4?'new-shift':'start'}" data-id="${active()?.caseId||CASES.find(c=>!g.completed.includes(c.id))?.id||'1048'}">${icon('work')}${g.completed.length===4?'Ще одна зміна':active()?'Повернутись до звернення':'Вийти на зміну'}</button><button class="btn hero-secondary" data-a="collection">Мої досягнення</button></div><p class="hero-note">Не поспішай. Якщо щось забулось — відкрий правила, вони для того й тут.</p></div><div class="hero-sticker"><span class="sticker-note">${g.completed.length===4?'Можна видихнути':'Я тут, якщо шо'}</span>${sticker(g.completed.length===4?'base':'patron-smile')}<div class="desk-note"><span>План на зміну</span><b>4 звернення</b><small>Спочатку розберемось, що замовили.</small></div></div></section><div class="section-head"><h2>Черга звернень</h2><p>Я б почала з першого. Але можна відкрити будь-який.</p></div><div class="casegrid">${CASES.map((original,i)=>{const c=ORIGINAL_CASES[i],done=g.completed.includes(c.id);const titles=['Спочатку покажу, що тут до чого','«Не темний» — це який?','Замовили дві. На складі одна.','Клієнт пише ще раз'];const descriptions=['Частину заповню я, частину залишу тобі. Так і пройдемо все замовлення.','Клієнт описав, що хоче. Але який саме товар додавати — ще треба з’ясувати.','Потрібної кількості немає. Треба домовитись із клієнткою, що робимо далі.','Клієнт надіслав квитанцію. Спочатку з’ясуй, до якого замовлення, і чи вже прийшли гроші.'];return `<article class="casecard mission ${done?'mission-done':''}"><div class="cardtop">${badgeMode(c)}<span class="mission-stage">${done?icon('check'):'Звернення '+(i+1)}</span></div><h3>${titles[i]}</h3><p>${descriptions[i]}</p><div class="cardbottom"><span class="mission-reward">${icon('spark')}${g.round>1?'Практика з новими умовами':[40,70,90,150][i]+' XP за досягнення'}</span><button class="btn ${!done&&i===0?'':'secondary'} compact" data-a="start" data-id="${c.id}">${active()?.caseId===c.id?'Продовжити':done?'Повторити':'Відкрити'}</button></div></article>`}).join('')}</div>${skillPanel()}${feedHTML()}<div class="skillbox"><p><b>Так, тут ще й меми.</b>Іноді прилітатимуть стікери. Якщо заважають — вимкни їх угорі. Усі замовлення й контакти тут вигадані.</p><div class="workspace-tools"><button class="btn secondary compact" data-a="rules">Правила магазину</button><button class="btn ghost compact" data-a="meme-sources">Джерела мемів</button></div></div></div>`;};
caze=function(){return active()?.scenario||CASES.find(c=>c.id===active()?.caseId);};
function makeScenario(id){const original=ORIGINAL_CASES.find(c=>c.id===id),c=JSON.parse(JSON.stringify(original)),round=initCampaign().round;c.displayId=String(+c.id+(round-1)*100);c.title=['Спочатку покажу, що тут до чого','«Не темний» — це який?','Замовили дві. На складі одна.','Клієнт пише ще раз'][ORIGINAL_CASES.indexOf(original)];if(round>1){const cities=Object.keys(BRANCHES);c.city=cities[(round+ORIGINAL_CASES.indexOf(original))%cities.length];c.branch=BRANCHES[c.city][round%3];c.message=c.message.replace(original.city,c.city).replace('№'+original.branch,'№'+c.branch);c.confirm=c.confirm.replace(original.city,c.city).replace('№'+original.branch,'№'+c.branch);if(id==='1061'){c.overrides.LW={onhand:round+2,reserved:round+1};if(round%2===0){c.items=[{id:'LW',qty:1},{id:'LB',qty:2}];c.message=c.message.replace('2 білі','3 білі');c.confirm=c.confirm.replace('одну білу та одну чорну','одну білу та дві чорні');c.actions.replacement.reply='Погоджую одну білу й дві чорні ORBIT. Усі настільні.';}const total=totals({...freshDraft(),cart:c.items,promo:c.promo},c).total;c.ledger=total;c.confirm=c.confirm.replace('2 682',new Intl.NumberFormat('uk-UA').format(total));}if(id==='1052'&&round%2===0){c.items=[{id:'MG',qty:1}];c.actions.variant.reply='Графітовий MOVE 18 л. Змінив рішення щодо кольору — беру цей.';c.confirm=c.confirm.replace('оливковий','графітовий');}}
c.originalItems=c.items.map(x=>({...x}));c.replacementConfirm=c.confirm;c.replacementExplain=JSON.parse(JSON.stringify(c.explain));return c;}
begin=function(id,restart=false){const old=active()?.id;raw.begin(id,restart);if(active()&&active().id!==old){active().scenario=makeScenario(id);active().dialogueChoices=[];active().world=[];active().guided=[];active().correctionHelp=0;active().firstDecision=null;recordEvent('Нове звернення #'+active().scenario.displayId,active().scenario.name+' очікує на відповідь.','Клієнт');save();render();}};
checks=function(d,c){const out=raw.checks(d,c);if(c.waiting){for(const x of out){if(x.id==='stock'){x.ok=d.final==='supply'&&!d.reserve&&itemsEqual(d.cart,c.items);x.why='Для очікування поставки не створюємо резерв понад вільний залишок.';}if(x.id==='reserve'){x.ok=!d.reserve;x.why='Клієнтка погодилась чекати. Не резервуємо відсутні одиниці.';}if(x.id==='clarification'){x.label='Очікування погоджено';x.ok=d.actions.includes('replacement');x.why='Очікування потрібно погодити з клієнткою в чаті.';}}}return out;};
function dialogueOptions(c){if(c.id==='1052')return [
 ['color','Уточнити колір','Який саме колір MOVE обираєте?','variant'],
 ['delivery','Перепитати про доставку','Підкажіть місто й відділення ще раз.','redundant'],
 ['change','Запропонувати темний варіант','Можемо оформити графітовий?','rejected']
 ];if(c.id==='1061')return [
 ['replace','Запропонувати інший варіант','Можу запропонувати чорну ORBIT замість відсутньої білої. Підійде?','replacement'],
 ['wait','Узгодити очікування поставки','Білих ламп зараз недостатньо. Чи готові зачекати на повну кількість?','waiting'],
 ['delivery','Уточнити доставку','Підкажіть місто й відділення ще раз.','redundant']
 ];if(c.id==='1068')return [
 ['repeat','Уточнити, щодо якого замовлення звернення','Це повторна покупка чи звернення щодо раніше оформленого замовлення?','duplicate'],
 ['receipt','Перепитати про квитанцію','Ви вже переказали кошти?','receipt'],
 ['delivery','Уточнити доставку','Куди доставити замовлення?','redundant']
 ];return [['delivery','Уточнити доставку','Підкажіть місто й відділення ще раз.','redundant']];}
function dialogueModal(){const c=caze();modal('Що запитаєш у клієнта?',`<p class="muted">Обери питання, яке допоможе вирішити ситуацію. Відповідь з’явиться в навчальному чаті.</p><div class="dialogue-options">${dialogueOptions(c).map(([id,title,q,type])=>`<button data-a="ask-client" data-key="${id}"><b>${title}</b><span>«${q}»</span></button>`).join('')}</div>`);}
function askClient(key){const c=caze(),a=active(),choice=dialogueOptions(c).find(x=>x[0]===key);if(!choice)return;const [id,title,q,type]=choice;let reply='';if(type==='variant'){reply=c.actions.variant.reply;if(!a.draft.actions.includes('variant'))a.draft.actions.push('variant');}else if(type==='replacement'){c.waiting=false;c.items=c.originalItems.map(x=>({...x}));c.final='warehouse';c.confirm=c.replacementConfirm;c.explain=JSON.parse(JSON.stringify(c.replacementExplain));c.requiredAction='replacement';reply=c.actions.replacement.reply;if(!a.draft.actions.includes('replacement'))a.draft.actions.push('replacement');}else if(type==='waiting'){c.waiting=true;const qty=c.originalItems.reduce((n,x)=>n+x.qty,0);c.items=[{id:'LW',qty}];c.final='supply';c.requiredAction='replacement';reply=`Так, зачекаю на всі ${qty} білі ORBIT. Не замінюйте колір. Погодимо відправлення після надходження.`;c.confirm=`Підтверджую: ${qty} білі ORBIT, ${c.city}, відділення №${c.branch}. Чекаю на поставку. Оплата залишається за цим замовленням.`;c.explain=[['Очікування за згодою','Клієнтка погодила очікування всіх білих ламп. Заміна кольору не виконується.'],['Без надлишкового резерву','Відсутні одиниці не резервуємо. Замовлення не передаємо на склад до надходження.'],['Оплата зберігається','Зарахований платіж прив’язаний до цього замовлення. Команда повернеться до відправлення після надходження товарів.']];if(!a.draft.actions.includes('replacement'))a.draft.actions.push('replacement');}else if(type==='duplicate'){reply=c.actions.duplicate.reply;if(!a.draft.actions.includes('duplicate'))a.draft.actions.push('duplicate');}else if(type==='receipt')reply='Так, скрін уже прикріпив. Але чи побачили ви надходження?';else if(type==='rejected')reply='Ні, спочатку уточнімо колір. Не хочу, щоб обрали за мене.';else reply=`Як писав/писала вище: ${c.city}, відділення №${c.branch}.`;
a.messages.push({role:'manager',text:q},{role:'client',text:reply});a.dialogueChoices.push({key,type,at:Date.now()});a.draft.confirmation='';closeModal();sourceTab='chat';if(innerWidth<=1050)sourceOpen=true;recordEvent(type==='redundant'?'Ці дані вже були в запиті':'Клієнт відповів',reply,'Клієнт');save();render();if(type==='duplicate')reaction('patron-surprised','Оце поворот','Це те саме замовлення. Друге створювати не треба.');else if(type==='waiting')reaction('patron-okay','Домовились','Клієнтка готова чекати. Тоді залишаємо білі лампи й чекаємо поставку.');else if(type==='variant'||type==='replacement')toast('Відповідь у чаті. Тепер онови картку за домовленістю.');}
sourceHTML=function(c,d){const copy={...c,actions:{}};let html=raw.sourceHTML(copy,d);html=html.replace('<div class="chatactions">','<div class="chatactions"><button data-a="dialogue">'+icon('chat')+'Поставити питання клієнту</button>');html=html.replace('Київ · відділення №12',c.city+' · відділення №'+c.branch);return html;};
function customerMismatches(d,c){const bad=[];if(d.name.trim().toLowerCase()!==c.name.toLowerCase())bad.push('отримувача');if(phoneNorm(d.phone)!==phoneNorm(c.phone))bad.push('номер');if(!itemsEqual(d.cart,c.items))bad.push('модель, колір або кількість');if(d.city!==c.city||d.branch!==c.branch||d.delivery!=='branch')bad.push('доставку');if(d.pay!==c.pay)bad.push('спосіб оплати');if(d.promo.trim().toUpperCase()!==c.promo)bad.push('промокод');return bad;}
confirmCustomer=function(){const a=active(),c=caze(),d=a.draft;if(!d.name||!d.phone||!d.cart.length||!d.city||!d.branch||!d.pay){toast('Потрібні отримувач, товари, доставка й спосіб оплати.');return;}const t=totals(d,c),q=`Підсумок: ${d.cart.map(x=>x.qty+' × '+product(x.id,c).name+', '+product(x.id,c).variant).join('; ')}. ${d.city}, №${d.branch}. ${PAY_NAMES[d.pay]}. Разом ${money(t.total)}.`;const mismatch=customerMismatches(d,c);let reply;if(c.requiredAction&&!d.actions.includes(c.requiredAction)){reply='Спершу уточнімо деталі. Я ще не погоджував/погоджувала цей варіант.';d.confirmation='';}else if(mismatch.length){reply='Зачекайте, перевірте '+mismatch.join(', ')+'. Домовленість у попередніх повідомленнях інша.';d.confirmation='';a.customerReturns=(a.customerReturns||0)+1;a.events.push({type:'customer-return',step,fields:mismatch,at:Date.now()});}else{reply=c.confirm;d.confirmation=signature(d);}
a.messages.push({role:'manager',text:q},{role:'client',text:reply});sourceTab='chat';if(innerWidth<=1050)sourceOpen=true;recordEvent(d.confirmation?'Підсумок погоджений':'Клієнт повернув картку',reply,'Клієнт',d.confirmation?'success':'info');save();render();if(d.confirmation)toast('Клієнт підтвердив підсумок. Наступна дія — у підказці над замовленням.');else reaction('patron-surprised','Стоп, звірмо','Клієнт не підтвердив картку. Виправ деталі за відповіддю в чаті.');};
demoFill=function(){const a=active(),c=caze();a.guided=a.guided||[];raw.demoFill();if(step===0)a.draft.phone='';if(step===1)a.draft.cart=c.items.map(x=>({...x,qty:1}));if(step===2)a.draft.payment='unknown';if(step===3){a.draft.reserve=false;a.draft.final='';a.messages=a.messages.map(m=>m.role==='manager'?{...m,text:m.text.replace('Київ, відділення №12',c.city+', відділення №'+c.branch)}:m);}if(!a.guided.includes(step))a.guided.push(step);save();render();};
function liveReservation(c,d){if(!d.cart.length)return '';return `<div class="live-stock"><span class="fieldlabel">${icon('box')}Стан товарів для цього замовлення</span>${d.cart.map(x=>{const p=product(x.id,c),free=available(x.id,c),own=d.reserve?x.qty:0;return `<div><span>${p.name} · ${p.variant}</span><b>вільно ${Math.max(0,free-own)} · у цьому резерві ${own}</b></div>`}).join('')}<small>${d.reserve?'Резерв прив’язаний до поточної картки. Зняття прапорця звільняє ці одиниці.':c.existing?'Попередній резерв збережений у замовленні №1039. Нового резерву немає.':'У поточній картці резерву ще немає.'}</small></div>`;}
work=function(){const c=caze();if(!c)return raw.work();const a=active(),d=a.draft;a.guided=a.guided||[];a.dialogueChoices=a.dialogueChoices||[];a.world=a.world||[];let html=raw.work();if(c.displayId)html=html.split('#'+c.id).join('#'+c.displayId);const brief=`<section class="case-brief"><div><span class="eyebrow">Звернення #${c.displayId||c.id}</span><b>${esc(c.name)}</b><p>${esc(c.message)}</p></div><button class="btn secondary compact" data-a="take-contact">${icon('person')}Перенести контакт</button></section>`;html=html.replace('<div class="workspace">',brief+'<div class="workspace">');if(c.mode==='demo'&&a.guided?.includes(step)){const tasks=['Тепер ти: додай номер із повідомлення клієнтки.','Тепер ти: глянь, скільки пляшок замовили, і поправ кількість.','Тепер ти: відкрий реєстр оплат і вкажи, чи прийшли гроші.','Тепер ти: постав резерв і вибери, кому передаємо замовлення.'];html=html.replace('<div class="panel"><nav',`<div class="your-turn">${icon('spark')}<b>${tasks[step]}</b></div><div class="panel"><nav`);}if(step===3)html=html.replace('<div class="formfooter">',liveReservation(c,d)+'<div class="formfooter">');html=html.replace('<div class="animate-in">','<div class="animate-in">'+campaignStrip());return html;};
function consequence(issue){if(['payment','bank'].includes(issue.id))return {who:'Максим · фінанси',title:'Платіж поки не підтверджений',text:'Не віддаємо це замовлення в комплектацію, поки не звіримо реєстр і статус оплати.',meme:'patron-surprised'};if(['stock','reserve'].includes(issue.id))return {who:'Софія · склад',title:'Картка повернулась зі складу',text:'У картці є проблема із залишком або резервом. Перевір, які одиниці можна використати.',meme:'patron-surprised'};if(issue.id==='final'||issue.id==='linked')return {who:'Софія · склад',title:'Потрібен інший наступний крок',text:'Поточний статус не відповідає стану замовлення. Звір оплати, домовленості та історію.',meme:'patron-surprised'};return {who:'Клієнтський чат',title:'Щось не сходиться',text:'Звір картку з тим, що написав клієнт. Десь відрізняються деталі.',meme:'patron-okay'};}
feedbackHTML=function(){if(!feedback)return '';if(!feedback.issues.length)return '<div class="feedback success">'+icon('check')+' Тут усе сходиться. Можна далі.</div>';const issue=feedback.issues[0],e=consequence(issue);return `<section class="feedback game-feedback" id="feedback" aria-live="polite"><div class="colleague"><span>${icon(e.who.includes('фінанси')?'bank':'chat')}</span><small>${e.who}</small></div><h3>${e.title}</h3><p>${e.text}</p><div class="report-actions"><button class="btn secondary compact" data-a="step" data-step="${issue.step}">Перевірити: ${STEP_NAMES[issue.step]}</button><button class="btn ghost compact" data-a="explain-issue">Що саме не так?</button></div>${active()?.showExplanation?`<div class="infobox"><p><b>${issue.label}</b><br>${issue.why}</p></div>`:''}<small>Ще треба перевірити: ${feedback.issues.length}. Показую по одному, щоб не звалювати все в купу.</small></section>`;};
validate=function(full){const a=active(),c=caze();if(!a)return;tick();const g=grade(a.draft,c),issues=full?g.issues:g.issues.filter(x=>x.step===step);a.metrics[step].checks++;issues.forEach(i=>a.metrics[i.step].errors++);if(full){a.attempts++;if(a.firstScore===null)a.firstScore=g.score;if(a.firstDecision===null)a.firstDecision=a.draft.final;}a.events.push({type:full?'full-check':'step-check',step,issues:issues.map(x=>x.id),at:Date.now()});a.showExplanation=false;

if(step===2){if(!d.city||!d.branch||!d.pay){title='Заповни доставку й спосіб оплати нижче';text='Місто, відділення й спосіб оплати є в повідомленні клієнта. Спочатку вибери місто — тоді з’являться його відділення. Фактичний статус оплати заповниш після перевірки реєстру.';buttons=sourceButton('chat','Знайти дані в чаті');}else if(c.pay!=='cod'&&!d.actions.includes('bank')){title='Тепер перевір, чи прийшли гроші';text='Натисни «Відкрити реєстр оплат». Порівняй суму в ньому з «Разом» унизу цього замовлення. Потім повернись сюди й вибери «Фактичний статус оплати». Скрін квитанції — ще не зарахування.';buttons=sourceButton('bank','Відкрити реєстр оплат');}else{title='Вкажи фактичний статус оплати';text=c.pay==='cod'?'Клієнт платить при отриманні. У полі «Фактичний статус оплати» вибери «Не оплачено».':'Сума зарахування є у вкладці «Оплати». Нижче, у полі «Фактичний статус оплати», вкажи, що бачиш у реєстрі. Потім натисни «Перевірити й далі».';buttons=sourceButton('bank','Ще раз глянути реєстр');}}
if(step===3){if(!d.confirmation||d.confirmation!==signature(d)){title='Надішли клієнту підсумок замовлення';text='Нижче є отримувач, товари, доставка й сума. Натисни «Надіслати підсумок клієнту». У чаті з’явиться відповідь. Якщо щось не так — клієнт напише, що відрізняється.';buttons='<button class="btn compact" data-a="confirm-customer">Надіслати підсумок клієнту</button>';}else if(c.existing){title='Прив’яжи звернення до попереднього замовлення';text='У полі «Пов’язане замовлення» вибери №'+c.existing+'. Новий резерв не ставимо. У «Наступному кроці» вибери роботу з існуючим замовленням.';buttons=sourceButton('history','Подивитись замовлення №'+c.existing);}else if(c.waiting){title='Залиш замовлення чекати на поставку';text='Клієнтка погодилась чекати. Резерв на відсутні товари не ставимо. У полі «Наступний крок» вибери «Узгодити очікування поставки».';}else if(!d.reserve){title='Постав резерв на товари';text='Клієнт уже підтвердив замовлення. Нижче постав галочку «Зарезервувати товари для цього замовлення». Потім у «Наступному кроці» вибери «Передати на склад».';}else{title='Вибери, куди передаємо замовлення';text='У полі «Наступний крок» вибери потрібну дію. Потім натисни «Перевірити й завершити» — перевіримо все замовлення.';}}
if(c.mode==='demo'){buttons+='<button class="btn secondary compact" data-a="demo-fill">Покажи приклад</button>';if(active().guided?.includes(step)){const tasks=[['Тепер додай номер клієнтки','Ім’я вже заповнила. Впиши номер із повідомлення в поле «Контактний номер» нижче.'],['Тепер поправ кількість у кошику','Товар уже додала. У кошику натисни «+» або «−», щоб кількість збігалася з повідомленням клієнтки.'],['Тепер вкажи, чи прийшли гроші','Доставку й спосіб оплати вже заповнила. Відкрий реєстр і вибери «Фактичний статус оплати» нижче.'],['Тепер постав резерв і вибери наступну дію','Клієнтка вже підтвердила підсумок. Нижче постав галочку резерву й вибери «Передати на склад».']];[title,text]=tasks[step];}}
return `<section class="step-instructions" id="step-instructions" aria-label="Що робити зараз"><span class="eyebrow">Зараз · ${STEP_NAMES[step]}</span><h2>${title}</h2><p>${text}</p><div class="instruction-actions">${buttons}</div><small>«Замовлення» — це поля під цією підказкою. «Чат», «Оплати» та «Історія» — дані, з якими їх звіряємо.</small></section>`;}
function cartDescription(rows,c){return rows.length?rows.map(x=>`${product(x.id,c).name}, ${product(x.id,c).variant} — ${x.qty} шт.`).join('; '):'жодного товару';}
function issueDetail(i,d,c){switch(i.id){case'name':return {where:'Клієнт · поле «Ім’я та прізвище»',current:d.name||'порожньо',expected:c.name,source:'chat',instruction:'Впиши ім’я з повідомлення клієнта в це поле.'};case'phone':return {where:'Клієнт · поле «Контактний номер»',current:d.phone||'порожньо',expected:c.phone,source:'chat',instruction:'Перенеси номер із повідомлення. Пробіли можна залишити.'};case'items':return {where:'Товари · кошик «У замовленні»',current:cartDescription(d.cart,c),expected:c.requiredAction&&!d.actions.includes(c.requiredAction)?'спочатку уточни деталі в клієнта':cartDescription(c.items,c),source:'chat',instruction:'У кошику можна прибрати зайвий товар і змінити кількість. Інший колір додається з каталогу.'};case'stock':return {where:'Товари · кількість у кошику',current:cartDescription(d.cart,c),expected:d.cart.length?d.cart.map(x=>`${product(x.id,c).name}, ${product(x.id,c).variant}: доступно ${available(x.id,c)} шт.`).join('; '):'додай товар із каталогу',source:'chat',instruction:'Порівняй кількість у кошику з «Доступно» в каталозі. Якщо не вистачає — погодь заміну або очікування в чаті.'};case'promo':return {where:'Товари · кошик · поле «Промокод із запиту»',current:d.promo||'порожньо',expected:c.promo||'залишити порожнім: клієнт не давав промокод',source:'chat',instruction:c.promo?'Впиши код у поле під товарами в кошику.':'Прибери код із поля під товарами в кошику.'};case'delivery':return {where:'Доставка й оплата · спосіб доставки, місто та відділення',current:`${d.city||'місто не обране'}, №${d.branch||'—'}; ${d.delivery==='branch'?'у відділення':d.delivery==='pickup'?'самовивіз':'кур’єром'}`,expected:`У відділення · ${c.city}, №${c.branch}`,source:'chat',instruction:'Вибери «У відділення», потрібне місто й номер відділення нижче.'};case'method':return {where:'Доставка й оплата · поле «Домовлений спосіб оплати»',current:PAY_NAMES[d.pay]||'не обрано',expected:PAY_NAMES[c.pay],source:'chat',instruction:'У цьому полі вибираємо спосіб, який назвав клієнт.'};case'payment':return {where:'Доставка й оплата · поле «Фактичний статус оплати»',current:PAYMENT_NAMES[d.payment],expected:PAYMENT_NAMES[c.payment],source:'bank',instruction:`У реєстрі: ${money(c.ledger)}. У замовленні разом: ${money(totals(d,c).total)}. ${c.ledger&&c.ledger!==totals(d,c).total?'Суми різні. Спочатку виправ товари й промокод на етапі «Товари».':c.pay==='cod'?'Післяплата ще не оплачена: гроші будуть при отриманні.':'Вибери статус за даними реєстру, а не квитанції.'}`};case'bank':return {where:'Матеріали звернення · вкладка «Оплати»',current:'реєстр ще не відкривали',expected:'переглянути зарахування',source:'bank',instruction:'Відкрий «Оплати», звір суму й повернись до замовлення.'};case'confirmation':return {where:'Передача · кнопка «Надіслати підсумок клієнту»',current:'поточні деталі ще не підтверджені',expected:'відповідь клієнта з підтвердженням',source:'chat',instruction:'Натисни кнопку під підсумком замовлення. Якщо клієнт не погодився — прочитай його відповідь у чаті й виправ конкретні поля.'};case'reserve':return {where:'Передача · галочка «Зарезервувати товари для цього замовлення»',current:d.reserve?'галочка стоїть':'галочки немає',expected:c.existing||c.waiting?'прибрати галочку':'поставити галочку',source:c.existing?'history':null,instruction:c.existing?'Резерв уже є в замовленні №'+c.existing+'. Другий не потрібен.':c.waiting?'Товарів ще немає. Залишаємо замовлення без нового резерву.':'Постав галочку перед передачею на склад.'};case'final':return {where:'Передача · поле «Наступний крок»',current:FINAL_NAMES[d.final]||'не обрано',expected:FINAL_NAMES[c.final],source:c.existing?'history':null,instruction:'Вибери цю дію в полі «Наступний крок», потім перевір замовлення ще раз.'};case'linked':return {where:'Передача · поле «Пов’язане замовлення»',current:d.linked?'№'+d.linked:'не обрано',expected:'№'+c.existing,source:'history',instruction:'Вибери попереднє замовлення в цьому полі. Нове створювати не треба.'};case'clarification':return {where:c.requiredAction==='duplicate'?'Клієнт · розмова про попереднє замовлення':'Товари · уточнення в чаті',current:'потрібної домовленості ще немає',expected:c.requiredAction==='variant'?'відповідь про колір':c.requiredAction==='duplicate'?'відповідь, чи це нова покупка':'відповідь про заміну або очікування',source:'chat',instruction:'Натисни «Запитати клієнта», вибери питання по суті й прочитай відповідь.'};default:return {where:STEP_NAMES[i.step],current:'потрібно перевірити',expected:i.label,instruction:i.why,source:'chat'};}}
function correctionHTML(){if(!feedback)return '';const d=active().draft,c=caze();const ids=feedback.issues.map(x=>x.id),remaining=checks(d,c).filter(x=>!x.ok&&ids.includes(x.id));feedback.issues=remaining;if(!remaining.length)return `<section class="correction resolved" role="status"><b>Поправила, тепер усе сходиться.</b><p>${step===3?'Натисни «Перевірити й завершити».':'Натисни «Перевірити й далі», щоб перейти до наступного етапу.'}</p></section>`;return `<section class="correction" id="feedback" aria-live="polite"><h2>Ось що треба поправити</h2><p>Це стосується замовлення №${esc(c.displayId||c.id)}. Заповнені дані залишились на місці.</p>${remaining.map(i=>{const t=issueDetail(i,d,c);return `<article class="specific-issue"><h3>${esc(t.where)}</h3><dl><dt>Зараз у тебе</dt><dd>${esc(t.current)}</dd><dt>З чим звіряємо</dt><dd>${esc(t.expected)}</dd></dl><p>${esc(t.instruction)}</p><div class="instruction-actions">${fixButton(i,i.id==='clarification'?'Запитати клієнта':i.id==='bank'?'Відкрити реєстр оплат':'Перейти до цього місця')}${t.source?sourceButton(t.source,'Подивитись: '+({chat:'чат',bank:'оплати',history:'історія'}[t.source])):''}</div></article>`;}).join('')}</section>`;}
const clarityScenario=makeScenario;
makeScenario=function(id){const c=clarityScenario(id);if(id==='1052'){const p=product(c.items[0].id,c);c.explain[0]=['Уточнення кольору','Клієнт обрав '+p.variant+'. У замовленні саме цей варіант.'];c.explain[1]=['Вільний залишок','Для цього варіанта доступно '+available(p.id,c)+' шт. Замовлено '+c.items[0].qty+' шт.'];}if(id==='1061'&&c.items.length){c.explain[0]=['Погоджені товари',cartDescription(c.items,c)+'. Клієнтка погодила ці варіанти в чаті.'];}c.replacementExplain=JSON.parse(JSON.stringify(c.explain));return c;};
const clarityWork=work;
work=function(){let html=clarityWork();if(!active())return html;html=html.replace(/<div class="your-turn">[\s\S]*?<\/div>/g,'');html=html.replace('<section class="panel-pad">',`<section class="panel-pad">${correctionHTML()}${feedback?.issues.length?'':flowInstruction(caze(),active().draft)}`);html=html.replace(/<button class="btn secondary compact" data-a="check-step">[\s\S]*?<\/button>/,'');html=html.replaceAll('Погодити підсумок у навчальному чаті','Надіслати підсумок клієнту').replace('data-a="confirm-customer">','id="confirm-order" data-a="confirm-customer">').replace('type="checkbox" data-field="reserve"','id="reserve-order" type="checkbox" data-field="reserve"').replace('Звір картку й обери наступну дію.','Нижче — все, що ти заповнила в цьому замовленні. Погодь підсумок із клієнтом, постав резерв за потреби й вибери наступний крок.');html=html.replaceAll('Далі: товари','Перевірити й далі').replaceAll('Далі: доставка','Перевірити й далі').replaceAll('Далі: перевірка','Перевірити й далі').replaceAll('Завершити розбір','Перевірити й завершити').replaceAll('Завершити оформлення','Перевірити й завершити');html=html.replace(/<section class="case-brief">[\s\S]*?<\/section>/,`<details class="case-message"><summary>Повідомлення від ${esc(caze().name)}</summary><p>${esc(caze().message)}</p></details>`);return html;};
const clarityRender=render;
render=function(){clarityRender();if(route!=='work'||!feedback||!active())return;for(const i of feedback.issues){const target=document.getElementById(FIELD_TARGETS[i.id]);if(target){target.classList.add('needs-fix');target.setAttribute('aria-invalid','true');}}};
const clarityRefresh=refreshCartUI;
refreshCartUI=function(id){clarityRefresh(id);if(feedback){const old=document.getElementById('feedback');if(old)old.outerHTML=correctionHTML();updateFixMarks();}};
function checkBeforeNext(){const a=active(),c=caze();tick();const issues=checks(a.draft,c).filter(i=>!i.ok&&i.step<=step);a.metrics[step].checks++;a.events.push({type:'guided-step-check',step,issues:issues.map(x=>x.id),at:Date.now()});if(!issues.length){feedback=null;moveStep(step+1);return;}a.metrics[step].errors+=issues.length;feedback={issues};const first=issues[0];if(first.step!==step){step=first.step;a.step=step;}if(step===1)productPane='basket';save();render();document.getElementById('feedback')?.scrollIntoView({block:'start',behavior:'auto'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!active())return;if(b.dataset.a==='next'){e.preventDefault();e.stopImmediatePropagation();checkBeforeNext();return;}if(b.dataset.a==='fix-field'){e.preventDefault();e.stopImmediatePropagation();const id=b.dataset.issue,i=checks(active().draft,caze()).find(x=>x.id===id);if(!i)return;if(id==='clarification'){dialogueModal();return;}if(id==='bank'){openSource('bank');return;}step=i.step;active().step=step;if(step===1)productPane='basket';save();render();const target=document.getElementById(FIELD_TARGETS[id]);target?.scrollIntoView({block:'center',behavior:'auto'});target?.focus({preventScroll:true});}},true);
// Keep directions and errors in sync without replacing a field while someone types.
document.addEventListener('input',e=>{if(!e.target.matches('[data-field]')||!active()||!feedback)return;queueMicrotask(()=>{const box=document.getElementById('feedback');if(box)box.outerHTML=correctionHTML();});});
const clarityConfirm=confirmCustomer;
confirmCustomer=function(){clarityConfirm();if(!active()||active().draft.confirmation)return;const issues=checks(active().draft,caze()).filter(i=>!i.ok&&['name','phone','items','promo','delivery','method','clarification'].includes(i.id));if(issues.length){feedback={issues};save();render();}};

const clarityReport=report;
report=function(){let html=clarityReport();const r=bestAttempt(reportId);if(!r)return html;const errors=r.metrics.reduce((n,x)=>n+x.errors,0);html=html.replaceAll('ПЕРША ПЕРЕВІРКА','ПЕРША ПОВНА ПЕРЕВІРКА').replace('Перевірок картки','Повних перевірок').replace('Повне оформлення','Перевірки всього замовлення');if(errors)html=html.replace('З першої перевірки все зійшлося.','Фінальну перевірку пройдено. На окремих етапах були виправлення — вони є в таблиці нижче.');return html;};
function updateFixMarks(){document.querySelectorAll('.needs-fix').forEach(el=>{el.classList.remove('needs-fix');el.removeAttribute('aria-invalid');});if(!feedback||!active())return;for(const i of feedback.issues){const el=document.getElementById(FIELD_TARGETS[i.id]);if(el){el.classList.add('needs-fix');el.setAttribute('aria-invalid','true');}}}
document.addEventListener('input',e=>{if(e.target.matches('[data-field]'))queueMicrotask(updateFixMarks);});

render();
</script>
</body></html>
